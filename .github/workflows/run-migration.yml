# Draait één migratie uit supabase/migrations op de live database, via de Supabase Management API.
# Alleen handmatig (Actions > Run migration), per bestand. Een migratie is niet met één klik terug te draaien:
# draai alleen wat lokaal getest is (npm run test:db).
name: Run migration

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Bestandsnaam in supabase/migrations, bijv. 20261105000000_crew_status.sql'
        required: true
        type: string

concurrency:
  group: run-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vaikzodfgmgwwqevyxww
      FILE: ${{ inputs.file }}
    steps:
      - uses: actions/checkout@v4
      - name: Bestand en token checken
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN ontbreekt."
            exit 1
          fi
          # alleen een gewone migratienaam, geen paden
          if ! [[ "$FILE" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
            echo "::error::Ongeldige bestandsnaam: $FILE"
            exit 1
          fi
          if [ ! -f "supabase/migrations/$FILE" ]; then
            echo "::error::Bestaat niet: supabase/migrations/$FILE"
            exit 1
          fi
      - name: Migratie draaien
        run: |
          set -euo pipefail
          body=$(jq -Rs '{query: .}' < "supabase/migrations/$FILE")
          status=$(curl -sS -o result.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$body")
          echo "HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Migratie mislukt: $(head -c 500 result.json)"
            exit 1
          fi
          echo "Migratie $FILE gedraaid."
